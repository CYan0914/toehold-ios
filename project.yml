# XcodeGen spec. `xcodegen generate` writes Toehold.xcodeproj from this file.
#
# The project file is generated rather than committed, so the source of truth
# for every build setting is this file and reviewable in a diff. Same shape as
# the house precedent (CareHive, TaoMind).
name: Toehold
options:
  bundleIdPrefix: com.cyan0914
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: 2.40
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: H4VQ9X6KYK
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

    # No INFOPLIST_KEY_* settings, and their absence is load-bearing. Those keys
    # only merge into a *generated* Info.plist; the target below sets
    # GENERATE_INFOPLIST_FILE to NO and points at an explicit file, so anything
    # declared that way is dropped from the built app without a warning. Every
    # Info.plist entry -- the display name, portrait-only, the encryption flag
    # -- lives in Resources/Info.plist.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Toehold:
    type: application
    platform: iOS
    sources:
      - path: ToeholdApp.swift
      - path: Core
      - path: Models
      - path: Services
      - path: Views
      # The entitlements file lives in this directory but is not a resource.
      # Without the exclusion it is swept into Copy Bundle Resources, which
      # ships a copy of the entitlement list inside the app and draws a warning
      # on every build. It still reaches the linker -- CODE_SIGN_ENTITLEMENTS
      # below names it by path, not through the project's file list.
      - path: Resources
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: Toehold
        PRODUCT_BUNDLE_IDENTIFIER: com.cyan0914.toehold
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO

        # iCloud (CloudKit) sync. Without this the app still builds, installs and
        # runs -- and every task stays on the device that created it, silently.
        # ModelContainer would fall back to a local store, which is exactly the
        # v1.0-degraded behaviour but for the wrong reason and with no signal.
        #
        # The matching iCloud container must exist on the App ID; the identifier
        # here and the one in the entitlements file are the same string.
        CODE_SIGN_ENTITLEMENTS: Resources/Toehold.entitlements

  # A test target from the start. The two pieces of logic here that are actually
  # easy to get wrong -- the template generator's scenario matching, and which
  # generator the factory picks -- are pure functions with no UI around them, and
  # they cannot be checked from the app's own build.
  ToeholdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Toehold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyan0914.toehold.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Toehold:
    build:
      targets:
        Toehold: all
        ToeholdTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ToeholdTests

    # `archive` has to be declared, and its absence is a real trap.
    #
    # A scheme with no Archive action is not an archivable product, so tooling
    # that asks "what can be archived here" gets an empty list, which reads like
    # the project cannot be built at all rather than like a missing scheme
    # action. Declared explicitly because this is the action every App Store
    # build goes through. Release, because archiving an unoptimised build is
    # never what the App Store wants.
    #
    # Only Toehold is archived: `build` above limits ToeholdTests to the test
    # action, so the test bundle stays out of the .xcarchive.
    archive:
      config: Release
